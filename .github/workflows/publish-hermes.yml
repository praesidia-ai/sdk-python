name: Publish praesidia-hermes

# INTEG-0125: plugins/hermes is its own PyPI project with its own tag namespace
# (hermes-v*; publish.yml's v* never matches it) and its own workflow file,
# because a PyPI trusted publisher is bound to exactly one workflow file.
# PyPI trusted publishing (OIDC); no token is stored. Setup: PUBLISHING.md "Plugins".

on:
  push:
    tags: ['hermes-v*']

permissions:
  contents: read

jobs:
  build:
    name: test + build + smoke (praesidia-hermes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Verify release tag matches plugin version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PLUGIN_VERSION="$(python -c "import tomllib; print(tomllib.load(open('plugins/hermes/pyproject.toml', 'rb'))['project']['version'])")"
          if [ "$RELEASE_TAG" != "hermes-v$PLUGIN_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match plugin version hermes-v$PLUGIN_VERSION" >&2
            exit 1
          fi

      - name: Verify tagged commit is contained in main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit $GITHUB_SHA is not contained in main" >&2
            exit 1
          fi

      # A plugin whose praesidia range PyPI cannot satisfy would upload uninstallable.
      - name: Verify the required praesidia range is on PyPI
        run: |
          REQ="$(python -c "import tomllib; print(next(d for d in tomllib.load(open('plugins/hermes/pyproject.toml', 'rb'))['project']['dependencies'] if d.startswith('praesidia')))")"
          if ! python -m pip download --no-deps --only-binary :all: --index-url https://pypi.org/simple \
               --dest "$RUNNER_TEMP/praesidia-range" "$REQ"; then
            echo "No release on PyPI satisfies $REQ; publish praesidia first" >&2
            exit 1
          fi

      - name: Build wheel + sdist
        run: |
          pip install build==1.3.0 twine==6.2.0
          python -m build plugins/hermes
          twine check plugins/hermes/dist/*

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: NousResearch/hermes-agent
          ref: 0390ace8179f4cf75bd3941e590dd74e638672b6
          path: upstream/hermes
          persist-credentials: false

      # Same pinned Hermes contract as ci.yml's frameworks job, on the built wheel.
      - name: Test the built wheel against pinned Hermes
        env:
          PRAESIDIA_REQUIRE_HERMES: '1'
          PRAESIDIA_HERMES_SOURCE: ${{ github.workspace }}/upstream/hermes
          OTEL_SDK_DISABLED: 'true'
        run: |
          pip install uv==0.5.24
          uv sync --frozen --extra dev --extra frameworks --group crewai
          uv pip install --no-deps plugins/hermes/dist/*.whl
          .venv/bin/python -m pytest tests/test_hermes_plugin.py -q

      # Clean venv outside the repo: praesidia resolves from PyPI, as a user gets it.
      - name: Smoke the wheel that will be uploaded
        run: |
          SMOKE="$RUNNER_TEMP/smoke"
          python -m venv "$SMOKE"
          cd "$RUNNER_TEMP"
          "$SMOKE/bin/pip" install --quiet --index-url https://pypi.org/simple "$GITHUB_WORKSPACE"/plugins/hermes/dist/*.whl
          "$SMOKE/bin/python" -c "import praesidia_hermes; from importlib.metadata import entry_points; (ep,) = entry_points(group='hermes_agent.plugins', name='praesidia'); assert ep.value == 'praesidia_hermes' and 'site-packages' in praesidia_hermes.__file__"
          "$SMOKE/bin/pip" check

      - name: Upload distributions for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: plugins/hermes/dist/
          if-no-files-found: error

  # Only this job can mint the OIDC token, and it never checks out or runs repo
  # code: it uploads the exact dist/ the build job tested and smoked.
  publish:
    name: publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/praesidia-hermes/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Also uploads PEP 740 digital attestations (the action's default).
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
