name: 🔗 API Contract Drift

# CD-0007 — praesidia/*.py hand-writes route strings/bodies against be-core's
# REST API. `praesidia` is a PUBLISHED, customer-installed PyPI package —
# nothing checked its calls against be-core before this: a be-core route
# rename or DTO field drop would ship silently to PyPI and 404/400 in a
# customer's application against a version they cannot easily roll back.
#
# Reuses the SAME scanner instance as `sdk` (CD-0006) via a sibling checkout
# — `sdk/scripts/audit-api-contract.mjs --lang py` — rather than a third,
# Python-native re-derivation. See that script's header comment for the full
# rationale (mcp-dev's original scanner generalized/copied once for `sdk`,
# then made to also read `.py` sources so `sdk-python` does not need its own
# copy). MONO-003 sibling-checkout pattern mirrors `mcp`'s and `sdk`'s own
# contract-drift.yml jobs.
#
# AUD-0063 — this job is also the ONLY place in CI where a fresh be-core spec
# is available, so it additionally runs the analytics resource coverage gate
# (tests/test_analytics_coverage.py) against this job's real
# `swagger.generated.json`. `ci.yml` runs `pytest` but checks out sdk-python
# alone, so that test only SKIPS there — this job is what makes it capable
# of actually failing a PR when be-core adds an analytics route the SDK
# doesn't cover. Mirrors mcp's/sdk's identical AUD-0062/AUD-0063 steps.

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod, develop]

permissions:
  contents: read

concurrency:
  group: sdk-python-contract-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-contract-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sdk-python (the PR under test)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          path: sdk-python

      - name: Checkout sdk (owns the shared contract-drift scanner, CD-0006)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          repository: praesidia-ai/sdk
          path: sdk
          token: ${{ secrets.SDK_READ_TOKEN || github.token }}

      - name: Checkout be-core (spec source of truth)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          repository: praesidia-ai/be-core
          path: be-core
          token: ${{ secrets.BE_CORE_READ_TOKEN || github.token }}

      - name: Checkout queue-core (be-core's local package sibling)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          repository: praesidia-ai/queue-core
          path: shared
          token: ${{ secrets.QUEUE_CORE_READ_TOKEN || github.token }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: be-core/package-lock.json

      - name: Build queue-core sibling
        working-directory: be-core
        run: npm run ci:prepare-queue-core

      - name: Install be-core deps
        working-directory: be-core
        run: npm ci

      - name: Export current OpenAPI from be-core
        working-directory: be-core
        env:
          OPENAPI_OUT: ../swagger.generated.json
          NODE_ENV: test
          JWT_SECRET: dummy-jwt-secret-for-export-openapi-only-32chars
          POSTGRES_HOST: localhost
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: praesidia
        run: npm run export:openapi

      - name: Audit sdk-python's hand-written API calls against the fresh be-core spec
        # `export:openapi`'s OPENAPI_OUT (`../swagger.generated.json`, set
        # relative to the `be-core` working-directory two steps up) lands one
        # level above `be-core/` — i.e. at this step's own (default) working
        # directory, the checkout workspace root — same as mcp's/sdk's own
        # contract-drift.yml jobs.
        run: |
          node sdk/scripts/audit-api-contract.mjs swagger.generated.json \
            --source sdk-python/praesidia --lang py

      # AUD-0063 — the coverage gate below is a pytest test, so this job
      # needs a Python toolchain too (every prior step here is Node-only,
      # since the drift scanner reads sdk-python's .py files as TEXT).
      # Mirrors ci.yml's own setup-python step/version choice.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: sdk-python/pyproject.toml

      - name: Install sdk-python and dev dependencies
        working-directory: sdk-python
        run: pip install -e ".[dev]"

      # This repo's own `ci.yml` never sees a be-core checkout, so run the
      # live analytics-route coverage check here instead, where
      # `../../swagger.generated.json` (this job's fresh export, resolved
      # from tests/) genuinely exists. Run BY PATH (not `-k "<pattern>"`) so
      # a renamed/deleted test file fails loudly rather than silently
      # collecting zero tests — same rationale as sdk's/mcp's equivalent
      # step. AUD_0063_REQUIRE_SWAGGER=true additionally turns "no spec
      # found" from a skip into a hard failure in THIS job specifically (see
      # the test file's own doc comment) — this job's only reason to run it
      # is having a fresh be-core export, so it must never go green having
      # never read one.
      - name: AUD-0063 — analytics resource coverage vs be-core
        working-directory: sdk-python
        env:
          AUD_0063_REQUIRE_SWAGGER: 'true'
        run: pytest tests/test_analytics_coverage.py -v
