name: CI

# Moved here from be-core's .github/workflows/sdk-python-check.yml when this
# package was extracted into its own repo. Same logic: install the SDK with dev
# extras, verify the import, run pytest.

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege: read-only; never writes contents, packages, or issues.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Import + Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.14']

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install SDK and dev dependencies
        run: pip install -e ".[dev]"

      - name: Verify SDK import
        run: python -c "from praesidia import Praesidia; print('SDK import OK')"

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Verify installed dependency consistency
        run: pip check

      # One matrix leg is sufficient: the resolved application dependency set
      # is shared, and auditing every Python version only repeats the same OSV
      # query. Pin the scanner itself so the gate is reproducible.
      - name: Audit dependencies against current advisories
        if: matrix.python-version == '3.14'
        run: |
          python -m pip install pip-audit==2.9.0
          pip-audit --local --skip-editable --progress-spinner off

      - name: Build and validate distribution
        if: matrix.python-version == '3.14'
        run: |
          pip install build twine
          python -m build
          twine check dist/*

  image:
    name: Reproducible image smoke
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The build stage runs the full suite and produces the wheelhouse consumed
      # by the minimal final stage, so the test stage cannot be pruned by BuildKit.
      - name: Build image
        run: docker build -t praesidia-python-sdk:ci .

      - name: Smoke image and verify runtime user
        run: |
          docker run --rm praesidia-python-sdk:ci
          USER_NAME="$(docker image inspect --format '{{.Config.User}}' praesidia-python-sdk:ci)"
          case "${USER_NAME}" in
            ''|0|root) echo "image runs as unsafe user '${USER_NAME}'"; exit 1 ;;
          esac
