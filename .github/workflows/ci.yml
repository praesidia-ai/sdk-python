name: CI

# Moved here from be-core's .github/workflows/sdk-python-check.yml when this
# package was extracted into its own repo. Same logic: install the SDK with dev
# extras, verify the import, run pytest.

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege: read-only; never writes contents, packages, or issues.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Import + Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.14']

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install SDK and dev dependencies
        run: pip install -e ".[dev,langgraph]"

      - name: Verify SDK import
        run: python -c "from praesidia import Praesidia; print('SDK import OK')"

      # Full-source coverage is enforced by the required Python3.11 frameworks
      # job, where optional native runtimes are actually installed/supported.
      - name: Run base SDK compatibility tests
        run: python -m pytest tests/ -v

      - name: Verify installed dependency consistency
        run: pip check

      # Audit the base SDK + LangGraph dependency profile. Optional framework
      # profiles have distinct dependencies; this is not an advisory-clean claim
      # for the CrewAI/Chroma profile documented in runtime-integrations.md. Pin the scanner itself so the gate is reproducible.
      - name: Audit dependencies against current advisories
        if: matrix.python-version == '3.14'
        run: |
          python -m pip install pip-audit==2.9.0
          pip-audit --local --skip-editable --progress-spinner off

      - name: Build and validate distribution
        if: matrix.python-version == '3.14'
        run: |
          pip install build==1.3.0 twine==6.2.0
          python -m build
          twine check dist/*

  frameworks:
    name: Native managed tools and restart contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OTEL_SDK_DISABLED: 'true'
      CREWAI_DISABLE_TELEMETRY: 'true'
      CREWAI_TRACING_ENABLED: 'false'
      PRAESIDIA_REQUIRE_FRAMEWORKS: '1'
      PRAESIDIA_REQUIRE_HERMES: '1'
      PRAESIDIA_HERMES_SOURCE: ${{ github.workspace }}/upstream/hermes
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: NousResearch/hermes-agent
          ref: 0390ace8179f4cf75bd3941e590dd74e638672b6
          path: upstream/hermes
          persist-credentials: false
      - name: Install locked optional frameworks and local Hermes entry point
        run: |
          pip install uv==0.5.24
          uv sync --frozen --extra dev --extra frameworks
          uv pip install --no-deps -e ./plugins/hermes
      - name: Actual native tools, durable approval and process restarts
        run: |
          .venv/bin/coverage run -m pytest tests/ -q
          .venv/bin/coverage report
          uv pip check
      - name: Audit native framework dependency profile
        # Current CrewAI1.15.20 -> ChromaDB1.1.1 advisories are intentionally
        # not ignored. This gate stays failing until an upstream resolution or
        # separately reviewed dependency change; base audit is a different scope.
        run: |
          uv pip install pip-audit==2.9.0
          .venv/bin/pip-audit --local --skip-editable --progress-spinner off

  image:
    name: Reproducible image smoke
    needs: [check, frameworks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The build stage runs the full suite and produces the wheelhouse consumed
      # by the minimal final stage, so the test stage cannot be pruned by BuildKit.
      - name: Build image
        run: docker build -t praesidia-python-sdk:ci .

      - name: Smoke image and verify runtime user
        run: |
          docker run --rm praesidia-python-sdk:ci
          USER_NAME="$(docker image inspect --format '{{.Config.User}}' praesidia-python-sdk:ci)"
          case "${USER_NAME}" in
            ''|0|root) echo "image runs as unsafe user '${USER_NAME}'"; exit 1 ;;
          esac
