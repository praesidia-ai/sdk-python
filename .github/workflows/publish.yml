name: Publish

# A release is published only from an immutable version tag whose value matches
# pyproject.toml. INTEG-0110: PyPI trusted publishing (OIDC). No token is stored
# in this repo; PyPI trusts this workflow file + the `pypi` environment only.
# One-time setup is in PUBLISHING.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: test + build + smoke (praesidia)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip

      - name: Verify release tag matches project version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PROJECT_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [ "$RELEASE_TAG" != "v$PROJECT_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match project version v$PROJECT_VERSION" >&2
            exit 1
          fi

      - name: Verify tagged commit is contained in main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit $GITHUB_SHA is not contained in main" >&2
            exit 1
          fi

      - name: Test and build wheel + sdist
        run: |
          pip install ".[dev,langgraph]" build==1.6.1 twine==7.0.0
          coverage run -m pytest tests/ -q
          coverage report
          python -m build
          twine check dist/*

      # SDK-0344 — install smoke (SDK-0331) on the exact wheel uploaded below;
      # nothing rebuilds dist/ between this step and the upload.
      - name: Smoke the wheel that will be uploaded
        run: WHEEL="$(ls dist/*.whl)" bash scripts/wheel_install_smoke.sh

      # SDK-0338 — CycloneDX SBOM of what a user gets from `pip install
      # praesidia`: the built wheel alone in a clean venv (no dev/test extras).
      # cyclonedx-bom runs runner-side via pipx (preinstalled on ubuntu-latest,
      # pinned here); it is not a project dependency.
      - name: Generate SBOM (CycloneDX)
        run: |
          python -m venv "$RUNNER_TEMP/sbom-venv"
          "$RUNNER_TEMP/sbom-venv/bin/pip" install --quiet dist/*.whl
          pipx run --spec cyclonedx-bom==7.4.0 cyclonedx-py environment \
            --pyproject pyproject.toml --mc-type library \
            --of JSON -o sbom.cdx.json "$RUNNER_TEMP/sbom-venv/bin/python"
          python -c "import json; assert json.load(open('sbom.cdx.json'))['bomFormat'] == 'CycloneDX'"

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error

      - name: Upload distributions for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Only this job can mint the OIDC token, and it never checks out or runs repo
  # code: it uploads the exact dist/ the build job tested and smoked.
  publish:
    name: publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/praesidia/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Also uploads PEP 740 digital attestations (the action's default).
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
