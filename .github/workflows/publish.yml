name: Publish

# A release is published only from an immutable version tag whose value matches
# pyproject.toml. Configure the PYPI_API_TOKEN repository secret before cutting
# a tag.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: build + twine upload (praesidia)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
          cache: pip

      - name: Verify release tag matches project version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PROJECT_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [ "$RELEASE_TAG" != "v$PROJECT_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match project version v$PROJECT_VERSION" >&2
            exit 1
          fi

      - name: Verify tagged commit is contained in main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit $GITHUB_SHA is not contained in main" >&2
            exit 1
          fi

      - name: Test and build wheel + sdist
        run: |
          pip install ".[dev,langgraph]" build==1.3.0 twine==6.2.0
          coverage run -m pytest tests/ -q
          coverage report
          python -m build
          twine check dist/*

      # SDK-0344 — install smoke (SDK-0331) on the exact wheel uploaded below;
      # nothing rebuilds dist/ between this step and the upload.
      - name: Smoke the wheel that will be uploaded
        run: WHEEL="$(ls dist/*.whl)" bash scripts/wheel_install_smoke.sh

      # SDK-0338 — CycloneDX SBOM of what a user gets from `pip install
      # praesidia`: the built wheel alone in a clean venv (no dev/test extras).
      # cyclonedx-bom runs runner-side via pipx (preinstalled on ubuntu-latest,
      # pinned here); it is not a project dependency.
      - name: Generate SBOM (CycloneDX)
        run: |
          python -m venv "$RUNNER_TEMP/sbom-venv"
          "$RUNNER_TEMP/sbom-venv/bin/pip" install --quiet dist/*.whl
          pipx run --spec cyclonedx-bom==7.4.0 cyclonedx-py environment \
            --pyproject pyproject.toml --mc-type library \
            --of JSON -o sbom.cdx.json "$RUNNER_TEMP/sbom-venv/bin/python"
          python -c "import json; assert json.load(open('sbom.cdx.json'))['bomFormat'] == 'CycloneDX'"

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error

      - name: Publish to PyPI
        run: twine upload --non-interactive dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
