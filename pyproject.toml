[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "praesidia"
version = "0.1.0"
description = "Python management SDK for the Praesidia AI agent platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["httpx>=0.27.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",   # httpx request mocking
]

[project.urls]
Homepage = "https://praesidia.ai"
Documentation = "https://docs.praesidia.ai/sdk/python"
Repository = "https://github.com/praesidia-ai/be-core"
"Bug Tracker" = "https://github.com/praesidia-ai/be-core/issues"

[tool.hatch.build.targets.wheel]
packages = ["praesidia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
