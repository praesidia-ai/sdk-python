[build-system]
# Pin the backend so an isolated release build cannot change metadata format
# underneath the same tag. Hatchling 1.32 emits Core Metadata 2.5, which Twine 7
# (CI and pypa/gh-action-pypi-publish v1.14.2) accepts.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "praesidia"
version = "0.5.0"
description = "Python management SDK for the Praesidia AI agent platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["httpx>=0.28.1,<1"]
authors = [{ name = "Praesidia", email = "hello@praesidia.ai" }]
keywords = ["praesidia", "ai-governance", "guardrails", "audit", "llm", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.optional-dependencies]
langgraph = ["langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4"]
openai-agents = ["openai-agents==0.22.3"]
google-adk = ["google-adk==2.10.0"]
microsoft-agent-framework = ["agent-framework-core==1.19.0"]
agno = ["agno==3.0.11"]
frameworks = [
    "openai-agents==0.22.3",
    "google-adk==2.10.0",
    "agent-framework-core==1.19.0",
    "agno==3.0.11",
    "langgraph==1.2.12",
    "langgraph-checkpoint-sqlite==3.1.1",
]
dev = [
    "coverage>=7.16.2,<8",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.16.0",
    "respx>=0.23.1",   # httpx request mocking
    "ruff>=0.16.9",
]

# INTEG-0110 — CrewAI 1.15.x pins ChromaDB ~=1.1.0 with four open advisories
# (docs/runtime-integrations.md). Until that is resolved it is a dependency
# group, not an extra: CI still installs and tests it (`--group crewai`), but
# the published metadata offers no `praesidia[crewai]` to install.
[dependency-groups]
crewai = ["crewai==1.15.23; python_version < '3.14'"]

[project.urls]
Homepage = "https://praesidia.ai"
Documentation = "https://github.com/praesidia-ai/sdk-python#readme"
Repository = "https://github.com/praesidia-ai/sdk-python"
"Bug Tracker" = "https://github.com/praesidia-ai/sdk-python/issues"
Changelog = "https://github.com/praesidia-ai/sdk-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["praesidia"]

[tool.hatch.build.targets.sdist]
# In an isolated Git worktree, .git is a metadata file rather than a directory.
# Never ship checkout paths or Git metadata in a source distribution.
exclude = ["/.git", "/.git/**", "/examples/refund_authorization"]

[tool.ruff.lint]
# Ruff defaults minus rules that are style-only here or would change public
# behaviour (TRY004 would turn documented ValueErrors into TypeErrors).
ignore = ["ASYNC221", "B017", "C408", "FURB162", "ISC004", "PLW1510", "PYI034",
          "PYI036", "RUF015", "RUF022", "S110", "SIM113", "SIM117", "TRY004"]

[tool.mypy]
files = ["praesidia"]

[[tool.mypy.overrides]]
# Optional framework extras; each adapter imports lazily and is tested with its extra.
module = ["agents", "agents.*", "agent_framework", "agent_framework.*", "agno.*", "crewai.*", "google.adk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["framework: actual optional runtime tool invocation (requires the relevant framework extra)"]

[tool.coverage.run]
branch = true
source = ["praesidia"]

[tool.coverage.report]
fail_under = 90
show_missing = true
