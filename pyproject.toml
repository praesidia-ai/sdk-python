[build-system]
# Newer Hatchling releases can emit Core Metadata 2.5, which Twine 6.2 rejects.
# Pin the backend that produces the currently publishable Metadata-Version 2.4
# so an isolated release build cannot change format underneath the same tag.
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "praesidia"
version = "0.3.1"
description = "Python management SDK for the Praesidia AI agent platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["httpx>=0.27.0,<1"]

[project.optional-dependencies]
dev = [
    "coverage>=7.6.0,<8",
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",   # httpx request mocking
]

[project.urls]
Homepage = "https://praesidia.ai"
Documentation = "https://docs.praesidia.ai/sdk/python"
Repository = "https://github.com/praesidia-ai/sdk-python"
"Bug Tracker" = "https://github.com/praesidia-ai/sdk-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["praesidia"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["praesidia"]

[tool.coverage.report]
fail_under = 90
show_missing = true
