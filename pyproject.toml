[build-system]
# Newer Hatchling releases can emit Core Metadata 2.5, which Twine 6.2 rejects.
# Pin the backend that produces the currently publishable Metadata-Version 2.4
# so an isolated release build cannot change format underneath the same tag.
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[project]
name = "praesidia"
version = "0.4.1"
description = "Python management SDK for the Praesidia AI agent platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["httpx>=0.27.0,<1"]
authors = [{ name = "Praesidia", email = "hello@praesidia.ai" }]
keywords = ["praesidia", "ai-governance", "guardrails", "audit", "llm", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.optional-dependencies]
langgraph = ["langgraph>=1.0,<2; python_version >= '3.10'", "langgraph-checkpoint-sqlite>=3,<4; python_version >= '3.10'"]
crewai = ["crewai==1.15.20; python_version >= '3.10' and python_version < '3.14'"]
openai-agents = ["openai-agents==0.22.3; python_version >= '3.10'"]
google-adk = ["google-adk==2.9.2; python_version >= '3.10'"]
microsoft-agent-framework = ["agent-framework-core==1.19.0; python_version >= '3.10'"]
agno = ["agno==3.0.10; python_version >= '3.10'"]
frameworks = [
    "crewai==1.15.20; python_version >= '3.10' and python_version < '3.14'",
    "openai-agents==0.22.3; python_version >= '3.10'",
    "google-adk==2.9.2; python_version >= '3.10'",
    "agent-framework-core==1.19.0; python_version >= '3.10'",
    "agno==3.0.10; python_version >= '3.10'",
    "langgraph==1.2.11; python_version >= '3.10'",
    "langgraph-checkpoint-sqlite==3.1.1; python_version >= '3.10'",
]
dev = [
    "coverage>=7.6.0,<8",
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",   # httpx request mocking
]

[project.urls]
Homepage = "https://praesidia.ai"
Documentation = "https://docs.praesidia.ai/sdk/python"
Repository = "https://github.com/praesidia-ai/sdk-python"
"Bug Tracker" = "https://github.com/praesidia-ai/sdk-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["praesidia"]

[tool.hatch.build.targets.sdist]
# In an isolated Git worktree, .git is a metadata file rather than a directory.
# Never ship checkout paths or Git metadata in a source distribution.
exclude = ["/.git", "/.git/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["framework: actual optional runtime tool invocation (requires the relevant framework extra)"]

[tool.coverage.run]
branch = true
source = ["praesidia"]

[tool.coverage.report]
fail_under = 90
show_missing = true
